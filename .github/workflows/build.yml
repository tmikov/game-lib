name: build
on: [push, pull_request]

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y
             libx11-dev libxi-dev libxcursor-dev libgl1-mesa-dev libasound2-dev
      - name: Verify vendored trees
        run: python3 tools/vendor.py check
      - name: Acceptance scenarios
        run: python3 tools/run_tests.py
      # Windowed examples are built, not run: sokol_app needs a display.

  headless:
    # The real regression test for the gfx/app split: a container with no X11
    # development packages at all must still configure and build sokol_gfx.
    runs-on: ubuntu-latest
    container: debian:bookworm-slim
    steps:
      - name: Minimal toolchain, deliberately without libx11-dev
        run: apt-get update && apt-get install -y build-essential cmake python3 git
      - uses: actions/checkout@v4
      - name: Configure and build with the dummy backend
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
                -DGAMELIB_SOKOL_BACKEND=dummy \
                -DGAMELIB_IMGUI=OFF -DGAMELIB_MINIAUDIO=OFF
          cmake --build build --target gamelib_sokol_gfx gamelib_box2d gamelib_stb_image
      - name: Configure, build and RUN a linking consumer (dummy backend)
        # The step above only ever builds static libraries: target_link_libraries()
        # on a STATIC library never invokes the linker, so this job could pass
        # forever even if gamelib_sokol_gfx's PUBLIC interface ever acquired an
        # X11 dependency. tests/headless-gfx/ is a real add_executable() that
        # calls sg_setup()/sg_shutdown() under the dummy backend -- building
        # and running it here is the actual regression test.
        run: |
          cmake -S tests/headless-gfx -B build-headless-gfx -DCMAKE_BUILD_TYPE=Debug \
                -DGAMELIB_ROOT="$PWD" -DGAMELIB_SOKOL_BACKEND=dummy
          cmake --build build-headless-gfx
          ./build-headless-gfx/headless_gfx
